<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roll — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page page--narrow" style="display: flex; align-items: center; min-height: 100vh; padding-top: 0; padding-bottom: 0;">
    <div style="width: 100%;">
      <div style="text-align: center; margin-bottom: 28px;">
        <a class="nav__brand" href="index.html" style="justify-content: center; font-size: 26px;">
          <span class="sprocket"></span>Roll
        </a>
      </div>

      <div class="auth-card">
        <h1 class="page-title" style="font-size: 22px;">Create your account</h1>
        <p class="page-sub" style="margin-bottom: 20px;">Start developing your first roll.</p>

        <div class="form-error" id="register-error"></div>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" autocomplete="new-password" required minlength="8" />
          </div>
          <div class="field">
            <label for="register-confirm">Confirm password</label>
            <input type="password" id="register-confirm" name="confirm" autocomplete="new-password" required minlength="8" />
          </div>
          <button type="submit" class="btn btn--block">Create account</button>
        </form>

        <div class="auth-card__foot">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
