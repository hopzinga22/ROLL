<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roll — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page page--narrow" style="display: flex; align-items: center; min-height: 100vh; padding-top: 0; padding-bottom: 0;">
    <div style="width: 100%;">
      <div style="text-align: center; margin-bottom: 28px;">
        <a class="nav__brand" href="index.html" style="justify-content: center; font-size: 26px;">
          <span class="sprocket"></span>Roll
        </a>
      </div>

      <div class="auth-card">
        <h1 class="page-title" style="font-size: 22px;">Sign in</h1>
        <p class="page-sub" style="margin-bottom: 20px;">Pick up where your roll left off.</p>

        <div class="form-error" id="login-error"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn--block">Sign in</button>
        </form>

        <div class="auth-card__foot">
          New here? <a href="register.html">Create an account</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
